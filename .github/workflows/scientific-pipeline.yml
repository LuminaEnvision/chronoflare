name: Multi-year scientific pipeline
on:
  workflow_call:
    inputs:
      resume_run_id:
        type: string
        default: ""
      max_new_requests:
        type: string
        default: "416"
    secrets:
      FIRMS_MAP_KEY:
        required: true
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Previous run containing multiyear-source-evidence (blank for new cache)
        type: string
        default: ""
      max_new_requests:
        description: Maximum new NASA attempts including retries, 0 for verified replay
        type: string
        default: "416"
permissions:
  contents: read
  actions: read
concurrency:
  group: multiyear-firms-acquisition
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        if: inputs.resume_run_id != ''
        with:
          name: multiyear-source-evidence
          path: ${{ runner.temp }}/multiyear-evidence
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - run: python -m pip install -r science/requirements.txt
      - name: Acquire or verify frozen requests
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          REQUEST_BUDGET: ${{ inputs.max_new_requests }}
        run: python science/scripts/acquire_multiyear.py --cache "$RUNNER_TEMP/multiyear-evidence" --max-new-requests "$REQUEST_BUDGET"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiyear-source-evidence
          path: ${{ runner.temp }}/multiyear-evidence/
          retention-days: 90
          if-no-files-found: error
      - name: Reconstruct complete blocks and audit real sample support
        if: always()
        run: python science/scripts/multiyear_readiness.py --cache "$RUNNER_TEMP/multiyear-evidence" --output "$RUNNER_TEMP/multiyear-observed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiyear-observed-evidence
          path: ${{ runner.temp }}/multiyear-observed/
          retention-days: 90
          if-no-files-found: error
      - name: Freeze and validate only when real sample prerequisites pass
        if: always()
        run: python science/scripts/run_scientific_experiments.py --cache "$RUNNER_TEMP/multiyear-evidence" --output "$RUNNER_TEMP/scientific-experiments"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-experiment-evidence
          path: ${{ runner.temp }}/scientific-experiments/
          retention-days: 90
          if-no-files-found: error
      - name: Remove runner source cache
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/multiyear-evidence"

  publish-readiness:
    if: always()
    needs: acquire
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: multiyear-observed-evidence
          path: ${{ runner.temp }}/multiyear-observed
      - uses: actions/download-artifact@v4
        with:
          name: scientific-experiment-evidence
          path: ${{ runner.temp }}/scientific-experiments
      - name: Publish sanitized readiness only to a review branch
        run: |
          mkdir -p docs/multiyear-evidence
          cp "$RUNNER_TEMP/multiyear-observed/readiness.json" docs/multiyear-evidence/readiness.json
          cp "$RUNNER_TEMP/scientific-experiments/summary.json" docs/multiyear-evidence/experiment-summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "data/multiyear-$GITHUB_RUN_ID"
          git add docs/multiyear-evidence/readiness.json docs/multiyear-evidence/experiment-summary.json
          if git diff --cached --quiet; then
            echo "Verified readiness is unchanged; no new review commit needed."
            exit 0
          fi
          git commit -m "data: record source-bound multi-year sample readiness"
          git push origin "data/multiyear-$GITHUB_RUN_ID"
