name: Test NASA FIRMS API access
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded API test or six-request historical pilot
        type: choice
        default: smoke
        options: [smoke, pilot, replay, preview]
      replay_run_id:
        description: Previous successful pilot run ID (replay only)
        type: string
        required: false
  push:
    branches: [main]
    paths: [.github/workflows/firms-smoke.yml]
permissions:
  contents: read
  actions: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned pilot geometry dependency
        if: inputs.mode == 'pilot' || inputs.mode == 'replay' || inputs.mode == 'preview'
        run: python -m pip install shapely==2.2.0
      - name: Run six-request historical pilot
        if: inputs.mode == 'pilot'
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python science/scripts/firms_pilot.py --output "$RUNNER_TEMP/firms-pilot"
      - name: Read previous evidence without another NASA request
        if: inputs.mode == 'replay' || inputs.mode == 'preview'
        uses: actions/download-artifact@v4
        with:
          name: firms-pilot-evidence
          path: ${{ runner.temp }}/firms-replay
          run-id: ${{ inputs.replay_run_id }}
          github-token: ${{ github.token }}
      - name: Re-audit previous evidence offline
        if: inputs.mode == 'replay'
        run: python science/scripts/firms_pilot.py --replay "$RUNNER_TEMP/firms-replay" --output "$RUNNER_TEMP/firms-pilot"
      - name: Prepare padded experimental solar calendar
        if: inputs.mode == 'preview'
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python science/scripts/solar_preview.py --evidence "$RUNNER_TEMP/firms-replay" --output "$RUNNER_TEMP/firms-solar-preview"
      - name: Retain solar preview evidence
        if: inputs.mode == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: firms-solar-preview-evidence
          path: ${{ runner.temp }}/firms-solar-preview/
          retention-days: 7
          if-no-files-found: error
      - name: Retain offline pilot evidence for review
        if: inputs.mode == 'pilot' || inputs.mode == 'replay'
        uses: actions/upload-artifact@v4
        with:
          name: firms-pilot-evidence
          path: ${{ runner.temp }}/firms-pilot/
          retention-days: 7
          if-no-files-found: error
      - name: Download one historical day inside a small Pantanal bounding box
        if: inputs.mode == '' || inputs.mode == 'smoke'
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: >-
          python science/scripts/firms_download.py
          --source MODIS_SP
          --bbox=-57,-19,-56,-18
          --start 2020-08-10
          --days 1
          --output "$RUNNER_TEMP/firms-smoke"
      - name: Summarize response without publishing raw data
        if: inputs.mode == '' || inputs.mode == 'smoke'
        env:
          REVIEW_OUTPUT: ${{ runner.temp }}/firms-smoke
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = json.loads((Path(os.environ["REVIEW_OUTPUT"]) / "provenance.json").read_text())
          summary = (
              "## NASA FIRMS API smoke test\n\n"
              f"Source: {metadata['source']}\n\n"
              f"Returned detections: {metadata['row_count']}\n\n"
              f"CSV SHA-256: `{metadata['sha256']}`\n\n"
              "The response schema, dates and bounding box passed validation. "
              "Coverage remains unknown; a zero row count does not establish zero fire. "
              "No public dataset or deployment was changed.\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write(summary)
          PY
      - name: Remove temporary download
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/firms-smoke" "$RUNNER_TEMP/firms-pilot" "$RUNNER_TEMP/firms-replay" "$RUNNER_TEMP/firms-solar-preview"
